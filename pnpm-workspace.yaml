# better-sqlite3 ships prebuilt binaries for every platform this project supports, so compiling it
# locally only adds a Python and C++ toolchain to the setup instructions. Listing it here keeps pnpm
# from offering the build rather than leaving it as an unapproved script.
ignoredBuiltDependencies:
  - better-sqlite3
  - sharp
  - unrs-resolver

onlyBuiltDependencies:
  - lefthook
