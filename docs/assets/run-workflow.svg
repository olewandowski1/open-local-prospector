<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" role="img" aria-labelledby="title description">
  <title id="title">From Search Brief To Shortlist</title>
  <desc id="description">A three-stage local research workflow powered by the user's Claude, Codex, or OpenCode subscriptions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55b58d" />
    </marker>
  </defs>

  <rect width="1440" height="520" rx="30" fill="#0f0f0e" />
  <text x="72" y="72" fill="#f4f1eb" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">From Search Brief To Shortlist</text>
  <text x="72" y="108" fill="#aaa59d" font-family="Arial, Helvetica, sans-serif" font-size="20">Bring your own Claude, Codex, or OpenCode subscription.</text>

  <g fill="none" stroke="#55b58d" stroke-width="4" marker-end="url(#arrow)">
    <path d="M 356 276 H 412" />
    <path d="M 1000 276 H 1040" />
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <rect x="72" y="164" width="284" height="224" rx="22" fill="#1d1d1b" stroke="#3a3a36" stroke-width="2" />
      <text x="102" y="208" fill="#55b58d" font-size="17" font-weight="700">01</text>
      <text x="102" y="250" fill="#f4f1eb" font-size="28" font-weight="700">Choose A Search</text>
      <text x="102" y="298" fill="#c4bfb6" font-size="21">Reda And Rumia</text>
      <text x="102" y="336" fill="#c4bfb6" font-size="21">Florist</text>
      <text x="102" y="374" fill="#8f8a82" font-size="18">Set A Target And Runtime</text>
    </g>

    <g>
      <rect x="412" y="142" width="588" height="268" rx="24" fill="#15251f" stroke="#55b58d" stroke-width="3" />
      <text x="448" y="190" fill="#55b58d" font-size="17" font-weight="700">02</text>
      <text x="448" y="232" fill="#f4f1eb" font-size="30" font-weight="700">Run Local Research</text>
      <text x="448" y="270" fill="#78ccaa" font-size="20" font-weight="700">Use Your Subscriptions Your Way</text>
      <text x="448" y="306" fill="#f4f1eb" font-size="22">Claude  •  Codex  •  OpenCode</text>

      <g font-size="18" font-weight="700" text-anchor="middle">
        <rect x="448" y="336" width="116" height="48" rx="12" fill="#20342c" stroke="#375b4b" />
        <text x="506" y="367" fill="#d9e9e1">Discover</text>
        <rect x="578" y="336" width="116" height="48" rx="12" fill="#20342c" stroke="#375b4b" />
        <text x="636" y="367" fill="#d9e9e1">Verify</text>
        <rect x="708" y="336" width="116" height="48" rx="12" fill="#20342c" stroke="#375b4b" />
        <text x="766" y="367" fill="#d9e9e1">Inspect</text>
        <rect x="838" y="336" width="126" height="48" rx="12" fill="#20342c" stroke="#375b4b" />
        <text x="901" y="367" fill="#d9e9e1">Score</text>
      </g>
    </g>

    <g>
      <rect x="1040" y="164" width="328" height="224" rx="22" fill="#1d1d1b" stroke="#3a3a36" stroke-width="2" />
      <text x="1070" y="208" fill="#55b58d" font-size="17" font-weight="700">03</text>
      <text x="1070" y="250" fill="#f4f1eb" font-size="28" font-weight="700">Review Candidates</text>
      <text x="1070" y="298" fill="#c4bfb6" font-size="21">Evidence And Sources</text>
      <text x="1070" y="336" fill="#c4bfb6" font-size="21">Shortlist Or Correct</text>
      <text x="1070" y="374" fill="#8f8a82" font-size="18">Suppress Or Export</text>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#8f8a82" text-anchor="middle">
    <text x="510" y="468">Local Data</text>
    <circle cx="591" cy="462" r="3" fill="#55b58d" />
    <text x="708" y="468">Deterministic Scores</text>
    <circle cx="825" cy="462" r="3" fill="#55b58d" />
    <text x="914" y="468">No Outreach</text>
  </g>
</svg>
